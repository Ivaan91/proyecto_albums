  <div class="container mt-5">
    <h2 class="text-light mb-4">Sugiere un Nuevo Álbum</h2>
    <form>
  <div class="mb-3">
    <label for="nombreUsuario" class="form-label text-light">Nombre</label>
    <input type="text" class="form-control" id="nombreUsuario" placeholder="Ej: Alex Turner">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label text-light">Correo Electrónico</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="banda" class="form-label text-light">Banda o Artista Sugerido</label>
    <input type="text" class="form-control" id="banda">
  </div>
  <div class="mb-3">
    <label for="album" class="form-label text-light">Álbum Sugerido</label>
    <input type="text" class="form-control" id="album">
  </div>
  <div class="mb-3">
    <label for="cancion1" class="form-label text-light">Canción destacada 1</label>
    <input type="text" class="form-control" id="cancion1">
  </div>
  <div class="mb-3">
    <label for="cancion2" class="form-label text-light">Canción destacada 2</label>
    <input type="text" class="form-control" id="cancion2">
  </div>
  <div class="mb-3">
    <label for="cancion3" class="form-label text-light">Canción destacada 3</label>
    <input type="text" class="form-control" id="cancion3">
  </div>
  <div id="mensajeForm" class="mb-3"></div>
  <button type="submit" class="btn btn-primary" onclick="validarForm(event)">Enviar Sugerencia</button>
  </form>

  </div>
